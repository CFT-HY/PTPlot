name: CI
on: push
env:
  PRIMARY_PYTHON_VERSION: "3.14"
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build
        run: uv build
      - name: Run Twine checks
        run: uvx twine check dist/*
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pip packages
          path: dist
          if-no-files-found: error
  cloc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Count Lines of Code (cloc) for the PTPlot module
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }}/ptplot --by-file-by-lang --vcs=git
      - name: Count Lines of Code (cloc) for the repository
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }} --by-file-by-lang --vcs=git
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Print versions
        run: |
          uv --version
          uv run --no-project python -V
      - name: Install requirements
        run: uv sync --locked
      - name: Run Ruff
        run: |
          set -o pipefail
          uv run ruff check docs examples ptplot ptplot_site tools conftest.py manage.py 2>&1 | tee ruff.txt
      - name: Upload results
        # The results are the most interesting when the check has failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lint
          path: |
            ${{ github.workspace }}/ruff.txt
          if-no-files-found: error
  pyrefly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Print versions
        run: |
          uv --version
          uv run --no-project python -V
      - name: Install requirements
        run: uv sync --locked
      - name: Run Pyrefly
        run: |
          set -o pipefail
          uv run pyrefly check 2>&1 | tee pyrefly.txt
      - name: Upload results
        # The results are the most interesting when the check has failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Pyrefly
          path: |
            ${{ github.workspace }}/pyrefly.txt
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: ptplot_site.settings.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Print versions
        run: |
          uv --version
          uv run --no-project python -V
      - name: Install requirements
        run: uv sync --locked
      - name: Print Numba sysinfo
        run: uv run numba --sysinfo | tee numba-sysinfo.txt
      - name: Create migrations
        run: uv run python manage.py makemigrations
      - name: Migrate database
        run: uv run python manage.py migrate
      - name: Check configuration
        run: uv run python manage.py check --fail-level WARNING
      - name: Generate PTtools reference data
        run: uv run python -c "from pttools.bubble.fluid_reference import ref; ref()"
      - name: Run tests with coverage
        run: |
          set -o pipefail
          uv run pytest --store-durations 2>&1 | tee test-output.txt
      - name: Upload results
        # The results are the most interesting when the tests have failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test results
          path: |
            .test_durations
            coverage.xml
            coverage.json
            htmlcov
            test-output.txt
          # The coverage reports are not created if the tests fail early.
          if-no-files-found: warn
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
