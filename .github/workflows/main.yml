name: CI
on: push
permissions:
  contents: read
# The reusable workflows and the setup-env action are from the dev branch of PTtools.
#
# Job dependencies, as in PTtools:
# lint -> build, docs, graph, test
jobs:
  build:
    needs: lint
    uses: CFT-HY/pttools/.github/workflows/build.yml@dev
  docs:
    # This lints the documentation without running the examples, and then builds the full documentation.
    needs: lint
    uses: CFT-HY/pttools/.github/workflows/docs.yml@dev
    with:
      timeout-minutes: 35
  graph:
    needs: lint
    uses: CFT-HY/pttools/.github/workflows/graph.yml@dev
    with:
      target: ptplot
  lint:
    uses: CFT-HY/pttools/.github/workflows/lint.yml@dev
  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: ptplot_site.settings.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv and Python environment
        uses: CFT-HY/pttools/.github/actions/setup-env@dev
        with:
          generate-reference-data: true
      - name: Create migrations
        run: python manage.py makemigrations
      - name: Migrate database
        run: python manage.py migrate
      - name: Check configuration
        run: python manage.py check --fail-level WARNING
      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest --store-durations 2>&1 | tee test-output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test results
          path: |
            .test_durations
            coverage.xml
            coverage.json
            htmlcov
            numba-sysinfo.txt
            test-output.txt
          if-no-files-found: error
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  typecheck:
    uses: CFT-HY/pttools/.github/workflows/typecheck.yml@dev
    with:
      # NumbaLSODA requires a Fortran compiler, which is not installed by default on ubuntu-slim.
      runs-on: ubuntu-latest
