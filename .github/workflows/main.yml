name: CI
on: push
env:
  PRIMARY_PYTHON_VERSION: "3.14"
jobs:
  cloc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count Lines of Code (cloc) for the PTPlot module
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }}/ptplot --by-file-by-lang --vcs=git
      - name: Count Lines of Code (cloc) for the repository
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }} --by-file-by-lang --vcs=git
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
      - name: Print Python version
        run: python -V
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load pip cache
        uses: actions/cache@v4
        with:
          path: .pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
            pip-
      - name: Install requirements
        run: |
          pip --cache-dir=.pip install --upgrade pip wheel
          pip --cache-dir=.pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Pylint
        run: DJANGO_SETTINGS_MODULE=ptplot_site.settings.dev pylint docs examples ptplot ptplot_site tools manage.py 2>&1 | tee pylint.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: Lint
          path: |
            ${{ github.workspace }}/pylint.txt
          if-no-files-found: error
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
      - name: Print Python version
        run: python -V
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load pip cache
        uses: actions/cache@v4
        with:
          path: .pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
            pip-
      - name: Install requirements
        run: |
          pip --cache-dir=.pip install --upgrade pip wheel
          pip --cache-dir=.pip install -r requirements.txt -r requirements-dev.txt
      - name: Load mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            mypy-${{ runner.os }}-
            mypy-
      - name: Run mypy
        run: mypy ptplot ptplot_site tools 2>&1 | tee mypy.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: Mypy
          path: |
            ${{ github.workspace }}/mypy.txt
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: ptplot_site.settings.dev
    steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
    - name: Print Python version
      run: python -V
    - name: Checkout
      uses: actions/checkout@v4
    - name: Load pip cache
      uses: actions/cache@v4
      with:
        path: .pip
        key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-${{ runner.os }}-
          pip-
    - name: Install requirements
      run: |
        pip --cache-dir=.pip install --upgrade pip wheel
        pip --cache-dir=.pip install -r requirements.txt -r requirements-dev.txt
    - name: Print Numba sysinfo
      run: numba --sysinfo | tee numba-sysinfo.txt
    - name: Create migrations
      run: python manage.py makemigrations
    - name: Migrate database
      run: python manage.py migrate
    - name: Check configuration
      run: python manage.py check --fail-level WARNING
    - name: Generate PTtools reference data
      run: python3 -c "from pttools.bubble.fluid_reference import ref; ref()"
    - name: Run tests with coverage
      run: coverage run
    - name: Create coverage reports
      run: |
        coverage combine
        coverage report | tee coverage.txt
        coverage html
        coverage xml
        coverage json
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: Coverage
        path: |
          ${{ github.workspace }}/coverage.txt
          ${{ github.workspace }}/coverage.xml
          ${{ github.workspace }}/coverage.json
          ${{ github.workspace }}/htmlcov
        if-no-files-found: error
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
