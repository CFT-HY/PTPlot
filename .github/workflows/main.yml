name: CI
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Print uv version
        run: |
          echo "uv ${UV_VERSION}"
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
      - name: Build
        run: uv build
      - name: Run Twine checks
        run: uvx twine check dist/*
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pip packages
          path: dist
          if-no-files-found: error
  cloc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Count Lines of Code (cloc) for the PTPlot module
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }}/ptplot --by-file-by-lang --vcs=git
      - name: Count Lines of Code (cloc) for the repository
        uses: djdefi/cloc-action@6
        with:
          options: ${{ github.workspace }} --by-file-by-lang --vcs=git
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
      - name: Print uv and Python versions
        run: |
          echo "uv ${UV_VERSION}"
          echo "Python ${PYTHON_VERSION}"
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
          PYTHON_VERSION: ${{ steps.setup-uv.outputs.python-version }}
      - name: Install requirements
        run: uv sync --locked
      - name: Run Pyrefly
        run: |
          set -o pipefail
          pyrefly check --output-format=full-text-with-github
      - name: Run Pyrefly coverage
        if: always()
        run: |
          pyrefly coverage report > coverage.json
          pyrefly coverage check --output-format=full-text-with-github
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: ptplot_site.settings.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
      - name: Print uv and Python versions
        run: |
          echo "uv ${UV_VERSION}"
          echo "Python ${PYTHON_VERSION}"
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
          PYTHON_VERSION: ${{ steps.setup-uv.outputs.python-version }}
      - name: Install requirements
        run: uv sync --locked
      - name: Print Numba sysinfo
        run: numba --sysinfo | tee numba-sysinfo.txt
      - name: Create migrations
        run: python manage.py makemigrations
      - name: Migrate database
        run: python manage.py migrate
      - name: Check configuration
        run: python manage.py check --fail-level WARNING
      - name: Generate PTtools reference data
        run: python -c "from pttools.bubble.fluid_reference import ref; ref()"
      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest --store-durations 2>&1 | tee test-output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test results
          path: |
            .test_durations
            coverage.xml
            coverage.json
            htmlcov
            numba-sysinfo.txt
            test-output.txt
          if-no-files-found: error
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
