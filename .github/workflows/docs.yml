name: Docs
on: push
env:
  PRIMARY_PYTHON_VERSION: "3.14"
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            docs/requirements.txt
      - name: Print Python version
        run: python -V
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y cm-super dvipng latexmk optipng texlive-latex-extra texlive-xetex fonts-freefont-otf xindy
      - name: Install requirements
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt -r requirements-dev.txt -r docs/requirements.txt
      - name: Generate PTtools reference data
        run: python3 -c "from pttools.bubble.fluid_reference import ref; ref()"
      - name: Generate documentation
        run: |
          cd docs
          make all-noplot
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Documentation
          path: |
            docs/_build
          if-no-files-found: error
