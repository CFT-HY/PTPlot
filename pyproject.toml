[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ptplot_gw"
version = "1.1.0"
description = "PTPlot tool for plotting phase transitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cosmology",
    "phase transitions",
    "gravitational waves"
]
authors = [
    {name = "David Weir", email = "david.weir@helsinki.fi"},
    {name = "Deanna Hooper", email = "deanna.hooper@helsinki.fi"},
    {name = "Jenni Häkkinen", email = "jenni.hakkinen@helsinki.fi"},
    {name = "Mika Mäki", email = "mika.x.maki@helsinki.fi"}
]
maintainers = [
    {name = "David Weir", email = "david.weir@helsinki.fi"},
    {name = "Mika Mäki", email = "mika.x.maki@helsinki.fi"}
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Matplotlib",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization"
]
# Keep this up to date with requirements.txt
dependencies = [
    "django >= 6.0.2",
    "django-github-sso >= 5.0.2",
    "dulwich >= 1.0.0",
    "gunicorn >= 25.0.1",
    "matplotlib >= 3.10.8",
    "numpy >= 2.3.5",
    "pandas >= 3.0.0",
    "scipy >= 1.15.2",
    "scipy >= 1.17.0"
]
requires-python = ">= 3.11"
# dynamic = ["version"]

[project.optional-dependencies]
pttools = [
    "pttools-gw[numbalsoda,performance]"
]

[project.urls]
homepage = "https://www.ptplot.org"
documentation = "https://ptplot.readthedocs.io"
issues = "https://github.com/CFT-HY/PTPlot/issues"
repository = "https://github.com/CFT-HY/PTPlot"

[tool.coverage.run]
branch = true
command_line = "manage.py test --noinput --parallel"
concurrency = [
    "thread",
    "multiprocessing"
]
source = ["."]
omit = [
    "**/envs/*",
    "**/venv/*"
]
parallel = true
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]
show_missing = true

[tool.django-stubs]
django_settings_module = "ptplot_site.settings.dev"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["debug_toolbar.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# On clusters "--numprocesses=auto" creates processes according to the total number of CPU cores
# instead of the number of cores available to the job.
# Therefore, it may be wise to set the number of processes manually.
addopts = "--alluredir=test-results/allure --cov=. --cov-report=html --cov-report=term --cov-report=term-missing --cov-report=xml --dist=loadscope --html=test-results/html/test-report.html --numprocesses=auto"
testpaths = [
    "tests"
]

[tool.setuptools.packages.find]
include = [
    # "ptplot",
    "ptplot.forms*",
    "ptplot.management*",
    "ptplot.migrations*",
    "ptplot.science*",
    "ptplot.static*",
    "ptplot.templates*",
    "ptplot.views*",
]
exclude = [
    "ptplot.tests",
    "ptplot_site"
]
