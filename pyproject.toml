[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ptplot-gw"
version = "1.1.0"
description = "PTPlot tool for plotting phase transitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cosmology",
    "phase transitions",
    "gravitational waves"
]
authors = [
    {name = "David Weir", email = "david.weir@helsinki.fi"},
    {name = "Deanna Hooper", email = "deanna.hooper@helsinki.fi"},
    {name = "Jenni Häkkinen", email = "jenni.hakkinen@helsinki.fi"},
    {name = "Mika Mäki", email = "mika.x.maki@helsinki.fi"}
]
maintainers = [
    {name = "David Weir", email = "david.weir@helsinki.fi"},
    {name = "Mika Mäki", email = "mika.x.maki@helsinki.fi"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Matplotlib",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 1 - Unstable",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
# Keep this up to date with requirements.txt.
# Please also ensure that compatible versions are available in LISA ProtoLab.
dependencies = [
    "django >= 6.0.5",
    "django-github-sso >= 5.0.2",
    "dulwich >= 1.2.4",
    "gunicorn >= 26.0.0",
    "matplotlib >= 3.10.9",
    "numpy >= 2.4.6",
    "pandas >= 3.0.3",
    "pttools-gw[numbalsoda,performance] == 0.10.0",
    "scipy >= 1.17.1"
]
requires-python = ">= 3.12"
# dynamic = ["version"]

# [project.optional-dependencies]
# pttools = [
#     "pttools-gw[numbalsoda,performance]"
# ]

[project.urls]
homepage = "https://www.ptplot.org"
documentation = "https://ptplot.readthedocs.io"
issues = "https://github.com/CFT-HY/PTPlot/issues"
repository = "https://github.com/CFT-HY/PTPlot"

[tool.coverage.run]
branch = true
command_line = "manage.py test --noinput --parallel"
concurrency = [
    "thread",
    "multiprocessing"
]
source = ["."]
omit = [
    "*/envs/*",
    "*/venv/*",
    "*.txt",
    "docs/_build/*",
    "test-results/*"
]
parallel = true
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:"
]
show_missing = true

[tool.pyrefly]
project-includes = [
    "docs",
    "examples",
    "ptplot",
    "ptplot_site",
    "tools",
    "conftest.py",
    "manage.py"
]
project-excludes = [
    "**/_build*",
    "**/auto_examples*"
]
ignore-missing-imports = [
    "debug_toolbar.*",
    "django_github_sso.*",
    "plotly.*",
    "sphinx_gallery.*"
]
# Numba is untyped, and its njit decorator would otherwise erase the signatures of the functions it decorates.
replace-imports-with-any = [
    "numba",
    "numba.*"
]

[tool.pytest.ini_options]
# On clusters "--numprocesses=auto" creates processes according to the total number of CPU cores
# instead of the number of cores available to the job.
# Therefore, it may be wise to set the number of processes manually.
addopts = [
    "--alluredir=test-results/allure",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=json",
    "--cov-report=term",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--dist=loadscope",  # This ensures that tests from the same class are run on the same worker.
    "--durations=50",
    "--durations-min=1.0",
    "--html=test-results/html/test-report.html",
    "--numprocesses=auto"
]
DJANGO_SETTINGS_MODULE = "ptplot_site.settings.dev"
testpaths = [
    "ptplot/tests"
]

[tool.ruff]
extend-exclude = [
    "docs/_build",
    "docs/auto_examples"
]
line-length = 120

[tool.ruff.lint]
# The Greek alpha is used in the user-visible names of the physics parameters.
allowed-confusables = ["α"]
select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "DJ",    # flake8-django
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "NPY",   # NumPy-specific rules
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W"      # pycodestyle warnings
]
ignore = [
    # Docstrings are not required for methods that inherit one, for dunder methods,
    # for nested classes such as the Django Meta classes, or for __init__.
    "D102",  # Missing docstring in public method
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
    "N802",  # invalid-function-name
    "N815",     # The names of the class attributes are not restricted.
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "RUF012"    # The class attributes of Django models, forms and admins are mutable by design.
]

[tool.ruff.lint.flake8-unused-arguments]
# Allow unused variadic names like *args and *kwargs
ignore-variadic-names = true

[tool.ruff.lint.isort]
# Sort "import x" and "from x import y" together.
force-sort-within-sections = true

[tool.ruff.lint.pep8-naming]
# The physics symbols that would otherwise be reported as invalid names
extend-ignore-names = [
    "beta_over_H",
    "beta_over_Hs",
    "beta_over_H_grid",
    "beta_over_H_points",
    "beta_over_H_set",
    "C",
    "F_gw0",
    "H0",
    "J",
    "K",
    "log10_beta_over_H_grid",
    "log10_beta_over_H_set",
    "log10_R_star",
    "log10_R_stars",
    "M",
    "R_star",
    "OmSens",
    "R",
    "Sh",
    "SI",
    "SII",
    "S_turb",
    "Tn",
    "Tstar_gstar",
    "T_star",
    "T_star_snr",
    "T_star_value"
]

[tool.ruff.lint.per-file-ignores]
# The contents of the submodules are re-exported on purpose.
"**/__init__.py" = [
    "F403"  # undefined-local-with-import-star
]
# The Sphinx configuration variables shadow builtins and are not documented individually.
"docs/conf.py" = [
    "A001"  # builtin-variable-shadowing
]
# The module docstring of a Sphinx-Gallery example has to start with an RST section title,
# which cannot end with a period and has to be followed directly by its underline.
"examples/**" = [
    "D205",  # missing-blank-line-after-summary
    "D400"  # missing-trailing-period
]
"ptplot/tests/**" = ["D104", "N802"]
# The Django settings are extended with star imports.
"ptplot_site/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.pydocstyle]
# This should be set to "sphinx" once it's supported.
# https://github.com/astral-sh/ruff/issues/6606
convention = "pep257"

[tool.setuptools.packages.find]
include = [
    # "ptplot",
    "ptplot.forms*",
    "ptplot.management*",
    "ptplot.migrations*",
    "ptplot.science*",
    "ptplot.static*",
    "ptplot.templates*",
    "ptplot.views*"
]
exclude = [
    "ptplot.tests",
    "ptplot_site"
]
